# Checks on every pull request and on master; also reused by release.yml on
# the tagged commit. Mirrors CONTRIBUTING.md "Required before opening any PR".
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: gofmt, vet, tests (with Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fips
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: fips_exit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fips" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"; [ -z "$out" ] || { echo "gofmt needed:"; echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (unit)
        run: go test ./...
      - name: go test (store and portal against Postgres)
        env:
          TEST_DATABASE_URL: postgres://fips:pw@localhost:5432/fips_exit
        run: go test -p 1 -count=1 ./backend/...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "::error::run go mod tidy"; exit 1; }

  shell:
    name: shell syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          for f in $(git ls-files '*.sh'); do sh -n "$f"; done
          echo "checked: $(git ls-files '*.sh' | wc -l) scripts"

  integration:
    name: container integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: nftables gate (real kernel, throwaway container)
        run: |
          if [ -f deploy/test/run-nft-gate-test.sh ]; then sh deploy/test/run-nft-gate-test.sh; else echo "not present on this branch"; fi
      - name: whole-device client tunnel (real Dante + tun2socks)
        run: |
          if [ -f deploy/client/test/run-tunnel-test.sh ]; then sh deploy/client/test/run-tunnel-test.sh; else echo "not present on this branch"; fi
