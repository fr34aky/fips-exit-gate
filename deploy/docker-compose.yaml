# fips-exit node — Phase 1 MVP bring-up.
#
# nftables and the fips TUN interface are host-level, and both Dante and the
# captive daemon must see the real fips source addresses, so every service uses
# host networking. Load the nftables ruleset on the host FIRST (see up.sh),
# then start this stack.
services:
  unbound:
    image: docker.io/klutchell/unbound:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./unbound.conf:/etc/unbound/unbound.conf:ro

  exit-clearnet:
    build: ../exit
    image: fips-exit/clearnet:dev
    network_mode: host
    restart: unless-stopped
    # dns is ignored under host networking; the host resolv.conf must point at
    # unbound (127.0.0.1) — see up.sh.
    environment:
      FIPS_IF: ${FIPS_IF:?set FIPS_IF}
      EXTERNAL_IF: ${EXTERNAL_IF:?set EXTERNAL_IF}
      CLEARNET_PORT: ${CLEARNET_PORT:-1080}
      WORKERS: ${WORKERS:-4}
    volumes:
      # Bind the config so edits don't require an image rebuild.
      - ../exit/sockd.conf:/srv/sockd.conf:ro
    cap_add:
      - NET_ADMIN   # Dante binds a specific interface

  # Phase 4b: second egress service — Tor. Same gate/captive/agent/billing, just
  # a new SOCKS endpoint on another port. Its SocksPort binds ONLY the fips
  # address (never the public interface — that would be an open proxy); the nft
  # gate lets only authorized fips sources reach it. Enable with `--profile tor`.
  tor:
    image: docker.io/osminogin/tor-simple:latest
    profiles: ["tor"]
    network_mode: host
    restart: unless-stopped
    entrypoint: ["tor"]
    command:
      - "--SocksPort"
      - "[${EXIT_FIPS_ADDR:?set EXIT_FIPS_ADDR}]:${TOR_PORT:-1081}"
      - "--SocksPolicy"
      - "accept [fd00::]/8"
      - "--SocksPolicy"
      - "reject *"
      - "--DataDirectory"
      - "/var/lib/tor"
      # Tor rejects private/internal destinations by default
      # (ClientRejectInternalAddresses 1), so clients cannot re-enter fips.
    volumes:
      - tor-data:/var/lib/tor

  captive:
    build:
      context: ..
      dockerfile: captive/Dockerfile
    image: fips-exit/captive:dev
    network_mode: host
    restart: unless-stopped
    environment:
      CAPTIVE_LISTEN: "[::]:${CAPTIVE_PORT:-1088}"
      CAPTIVE_PORTAL_URL: ${CAPTIVE_PORTAL_URL:?set CAPTIVE_PORTAL_URL}
      CAPTIVE_TOKEN_SECRET: ${CAPTIVE_TOKEN_SECRET:?set CAPTIVE_TOKEN_SECRET}
      CAPTIVE_METRICS_ADDR: ${CAPTIVE_METRICS_ADDR:-}

  # Phase 2: the agent OWNS the nftables authorized set (replaces the static
  # allowlist). Enable with `--profile agent`; do not also seed allowlist.txt.
  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: fips-exit/agent:dev
    profiles: ["agent"]
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - agent-state:/var/lib/fips-exit-agent
    environment:
      FIPS_AGENT_BACKEND_URL: ${FIPS_AGENT_BACKEND_URL:-}
      FIPS_AGENT_ENROLL_TOKEN: ${FIPS_AGENT_ENROLL_TOKEN:-}
      FIPS_AGENT_TABLE: "inet fips_exit"
      FIPS_AGENT_NODE_NAME: ${FIPS_AGENT_NODE_NAME:-exit-01}
      FIPS_AGENT_FAIL_CLOSED_AFTER_GRACE: ${FIPS_AGENT_FAIL_CLOSED_AFTER_GRACE:-0}
      FIPS_AGENT_METRICS_ADDR: ${FIPS_AGENT_METRICS_ADDR:-}

volumes:
  agent-state:
  tor-data:
