# fips-exit node — Phase 1 MVP bring-up.
#
# nftables and the fips TUN interface are host-level, and both Dante and the
# captive daemon must see the real fips source addresses, so every service uses
# host networking. Load the nftables ruleset on the host FIRST (see up.sh),
# then start this stack.

# Explicit project name so this exit stack is isolated from the backend stack
# (backend-compose.yaml) when both run from this directory — otherwise they share
# the default "deploy" project and each reports the other's containers as orphans
# (and `--remove-orphans` would delete the wrong stack).
name: fips-exit

# Bounded log retention (privacy): Dante logs errors only — no successful
# connection/destination logging — but cap retention anyway. See docs/hardening.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  unbound:
    image: docker.io/klutchell/unbound:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./unbound.conf:/etc/unbound/unbound.conf:ro

  # Clearnet egress engine. No longer client-facing: the dispatcher owns the
  # connectivity port on the fips address and forwards non-onion CONNECTs here
  # over loopback. Dante still enforces the full egress policy on every request.
  exit-clearnet:
    build: ../exit
    image: fips-exit/clearnet:dev
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    # dns is ignored under host networking; the host resolv.conf must point at
    # unbound (127.0.0.1) — see up.sh.
    environment:
      FIPS_IF: ${FIPS_IF:?set FIPS_IF}
      EXIT_FIPS_ADDR: ${EXIT_FIPS_ADDR:?set EXIT_FIPS_ADDR}
      EXTERNAL_IF: ${EXTERNAL_IF:?set EXTERNAL_IF}
      # Loopback bind + port: reached only by the local dispatcher, never fips.
      CLEARNET_BIND: ${CLEARNET_BIND:-127.0.0.1}
      CLEARNET_PORT: ${CLEARNET_PORT:-1090}
      WORKERS: ${WORKERS:-4}

  # Connectivity dispatcher (Phase 4c): the client-facing SOCKS endpoint on the
  # connectivity port. Routes by destination — *.onion to Tor's loopback
  # SocksPort, everything else to Dante over loopback. One gated, metered port
  # at one rate, so the gate/agent/billing are unchanged. Onion routing needs
  # the `tor` profile running (the same Tor that powers the :1081 privacy rail);
  # without it, clearnet still works and .onion returns a SOCKS error.
  dispatch:
    build:
      context: ..
      dockerfile: dispatch/Dockerfile
    image: fips-exit/dispatch:dev
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISPATCH_LISTEN: "[${EXIT_FIPS_ADDR:?set EXIT_FIPS_ADDR}]:${CONNECTIVITY_PORT:-1080}"
      DISPATCH_CLEARNET_UPSTREAM: "127.0.0.1:${CLEARNET_PORT:-1090}"
      DISPATCH_TOR_UPSTREAM: "127.0.0.1:${TOR_DISPATCH_PORT:-9052}"
    volumes:
      # Bind the config so edits don't require an image rebuild.
      - ../exit/sockd.conf:/srv/sockd.conf:ro
    cap_add:
      - NET_ADMIN   # Dante binds a specific interface

  # Phase 4b: second egress service — Tor. Same gate/captive/agent/billing, just
  # a new SOCKS endpoint on another port. Its SocksPort binds ONLY the fips
  # address (never the public interface — that would be an open proxy); the nft
  # gate lets only authorized fips sources reach it. Enable with `--profile tor`.
  tor:
    image: docker.io/osminogin/tor-simple:latest
    profiles: ["tor"]
    network_mode: host
    restart: unless-stopped
    entrypoint: ["tor"]
    command:
      # Privacy rail (:1081): fips clients force ALL traffic through Tor.
      - "--SocksPort"
      - "[${EXIT_FIPS_ADDR:?set EXIT_FIPS_ADDR}]:${TOR_PORT:-1081}"
      # Loopback SocksPort for the connectivity dispatcher's *.onion path only.
      # Reachable only from the local host; never bound on fips/public.
      - "--SocksPort"
      - "127.0.0.1:${TOR_DISPATCH_PORT:-9052}"
      # Source policy (first match wins): the local dispatcher, then fips
      # clients, then reject everything else.
      - "--SocksPolicy"
      - "accept 127.0.0.1"
      - "--SocksPolicy"
      - "accept [fd00::]/8"
      - "--SocksPolicy"
      - "reject *"
      - "--DataDirectory"
      - "/var/lib/tor"
      # Tor rejects private/internal destinations by default
      # (ClientRejectInternalAddresses 1), so clients cannot re-enter fips.
    volumes:
      - tor-data:/var/lib/tor
    healthcheck:
      # The image's default healthcheck probes Tor's default :9050 SocksPort,
      # which we don't expose (we bind :1081 + the loopback dispatch port), so it
      # always reads "unhealthy". Probe the loopback dispatch SocksPort instead —
      # "healthy" then genuinely means Tor egress works.
      test: ["CMD", "curl", "-sf", "--socks5-hostname", "127.0.0.1:${TOR_DISPATCH_PORT:-9052}", "https://check.torproject.org/api/ip"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  # Optional egress service — an HTTP forward proxy on :3128 for clients/OSes
  # that speak HTTP proxy but not SOCKS. It carries no egress policy of its own:
  # it forwards every request (plaintext + CONNECT) to Dante over loopback, so it
  # inherits the full policy + server-side DNS. Binds EXIT_FIPS_ADDR only (never
  # the public interface — that would be an open proxy); the nft gate lets only
  # authorized fips sources reach it. Enable with `--profile http`, together with
  # uncommenting `http 3128` in services.conf and registering the catalog row —
  # see docs/http-proxy.md.
  httpproxy:
    build:
      context: ..
      dockerfile: httpproxy/Dockerfile
    image: fips-exit/httpproxy:dev
    profiles: ["http"]
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      HTTPPROXY_LISTEN: "[${EXIT_FIPS_ADDR:?set EXIT_FIPS_ADDR}]:${HTTPPROXY_PORT:-3128}"
      HTTPPROXY_UPSTREAM: "127.0.0.1:${CLEARNET_PORT:-1090}"

  captive:
    build:
      context: ..
      dockerfile: captive/Dockerfile
    image: fips-exit/captive:dev
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      CAPTIVE_LISTEN: "[::]:${CAPTIVE_PORT:-1088}"
      CAPTIVE_PORTAL_URL: ${CAPTIVE_PORTAL_URL:?set CAPTIVE_PORTAL_URL}
      CAPTIVE_TOKEN_SECRET: ${CAPTIVE_TOKEN_SECRET:?set CAPTIVE_TOKEN_SECRET}
      CAPTIVE_METRICS_ADDR: ${CAPTIVE_METRICS_ADDR:-}

  # Phase 2: the agent OWNS the nftables authorized set (replaces the static
  # allowlist). Enable with `--profile agent`; do not also seed allowlist.txt.
  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: fips-exit/agent:dev
    logging: *default-logging
    profiles: ["agent"]
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - agent-state:/var/lib/fips-exit-agent
    environment:
      FIPS_AGENT_BACKEND_URL: ${FIPS_AGENT_BACKEND_URL:-}
      FIPS_AGENT_ENROLL_TOKEN: ${FIPS_AGENT_ENROLL_TOKEN:-}
      FIPS_AGENT_TABLE: "inet fips_exit"
      FIPS_AGENT_NODE_NAME: ${FIPS_AGENT_NODE_NAME:-exit-01}
      FIPS_AGENT_FAIL_CLOSED_AFTER_GRACE: ${FIPS_AGENT_FAIL_CLOSED_AFTER_GRACE:-0}
      FIPS_AGENT_METRICS_ADDR: ${FIPS_AGENT_METRICS_ADDR:-}

volumes:
  agent-state:
  tor-data:
