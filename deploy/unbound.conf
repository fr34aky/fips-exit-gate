# Server-side DNS for the exit node. Dante resolves client hostnames
# (SOCKS5 ATYP=domain) here, so resolution happens on the exit, not the client.
# Privacy-first: no query logging, in-memory cache only.
server:
    interface: 127.0.0.1
    interface: ::1
    # WireGuard tunnel clients resolve through the exit too (DNS pushed in their
    # config = the gateway addresses). ip-freebind lets unbound start before
    # wg0 exists. Keep these in sync with WG_GW4 / WG_GW6 in .env.
    interface: 10.64.0.1
    interface: fc10:f1b5:ea17::1
    ip-freebind: yes
    port: 53
    # Run in the foreground: unbound is PID 1 of its container. unbound's default
    # is to daemonize (fork to background), which makes PID 1 exit immediately and
    # the container crash-loop. See docs/troubleshooting.md.
    do-daemonize: no
    # Use the system default socket buffer; the container can't raise it, and
    # asking for a bigger one just logs a harmless so-sndbuf warning every start.
    so-sndbuf: 0
    # Only the exit host itself queries this resolver.
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    # The WireGuard inner pools (the nftables policy only lets tunnel clients
    # reach port 53 on the gateway addresses, never the public interface).
    access-control: 10.64.0.0/16 allow
    access-control: fc10:f1b5:ea17::/64 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    do-ip4: yes
    do-ip6: yes
    prefer-ip6: no

    # Privacy / hardening.
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    logfile: ""
    verbosity: 0
    log-queries: no
    log-replies: no

    # In-memory cache; no on-disk persistence of who resolved what.
    cache-max-ttl: 3600
    cache-min-ttl: 0
    rrset-cache-size: 64m
    msg-cache-size: 32m
