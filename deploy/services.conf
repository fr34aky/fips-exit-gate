# Egress service catalog for this exit node: "<key> <port>", one per line.
# This is the single source of truth the render script templates over — adding
# an egress layer (e.g. Tor) is one line here plus running its SOCKS endpoint
# on that port. Keep in sync with the backend `services` table.
#
# Port 1080 is the "connectivity" service (display name "Connectivity"). Its
# SOCKS endpoint is the dispatcher, which reaches clearnet + .onion (Phase 4c);
# the gate/accounting only see the port, so the key stays 'clearnet'.
clearnet 1080
# Phase 4b Tor egress (see docs/phase4b-tor.md). Uncomment together with:
#   - `docker compose --profile tor up -d tor`  (SOCKS endpoint on :1081)
#   - registering the catalog row: POST /admin/services {key:tor,port:1081,rate_ppm:1500000}
# then `./up.sh reload` to gate + meter :1081. Enable all three together.
# tor 1081
# HTTP forward proxy (see docs/http-proxy.md). Same gate/captive/agent/billing —
# just an HTTP endpoint instead of SOCKS, for clients that speak HTTP proxy only.
# Uncomment together with:
#   - `docker compose --profile http up -d httpproxy`  (HTTP proxy on :3128)
#   - registering the catalog row: POST /admin/services {key:http,port:3128,rate_ppm:1000000}
# then `./up.sh reload` to gate + meter :3128. Enable all three together.
# http 3128
