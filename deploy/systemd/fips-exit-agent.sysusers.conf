# systemd-sysusers fragment for the exit-agent's unprivileged account.
#   install -Dm644 fips-exit-agent.sysusers.conf /usr/lib/sysusers.d/fips-exit-agent.conf
#   systemd-sysusers
# (or: useradd --system --home /var/lib/fips-exit-agent --shell /usr/sbin/nologin fips-exit-agent)
u fips-exit-agent - "fips-exit node agent" /var/lib/fips-exit-agent
