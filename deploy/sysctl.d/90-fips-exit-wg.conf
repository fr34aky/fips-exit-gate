# fips-exit WireGuard service: the exit forwards between wg0 and the public
# interface. Install to /etc/sysctl.d/ and `sysctl --system`.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# With forwarding on, a host ignores router advertisements unless accept_ra=2;
# without this a SLAAC-learned public IPv6 default route disappears. Replace
# eth0 with EXTERNAL_IF.
net.ipv6.conf.eth0.accept_ra = 2
