# fips-exit backend host (separate from the exit nodes): Postgres + control plane.
# Copy backend.env.example to backend.env and fill in secrets.

# Explicit project name so the backend stack is isolated from the exit stack
# (docker-compose.yaml) when both run from this directory.
name: fips-exit-backend

# Bounded log retention. See docs/hardening.md#logging--privacy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${PGUSER:-fips}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-fips_exit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-fips}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Published on loopback so the host-networked backend can reach it at
    # 127.0.0.1:5432 (a host-net container can't resolve the compose 'db' name).
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: fips-exit/backend:dev
    restart: unless-stopped
    logging: *default-logging
    # Host networking so the backend binds the fips address (portal reachable over
    # fips) AND sees real client source addresses (transparent login). Do NOT add
    # a `ports:` mapping here — host mode already publishes on every host
    # interface, and compose rejects host mode + ports together.
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Host-net can't resolve the compose 'db' name; reach it on the loopback
      # port the db publishes.
      DATABASE_URL: postgres://${PGUSER:-fips}:${PGPASSWORD}@127.0.0.1:5432/${PGDATABASE:-fips_exit}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      LISTEN: ":8080"
      SESSION_SECRET: ${SESSION_SECRET:-}
      CHALLENGE_SECRET: ${CHALLENGE_SECRET:-}
      CAPTIVE_TOKEN_SECRET: ${CAPTIVE_TOKEN_SECRET:-}
      # Defaults suit the fips portal over HTTP (host networking); override in
      # backend.env if you front the portal with a source-masking HTTPS proxy.
      PORTAL_TRUST_FIPS_SOURCE: ${PORTAL_TRUST_FIPS_SOURCE:-1}
      PORTAL_SECURE_COOKIES: ${PORTAL_SECURE_COOKIES:-0}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8080}
      PORTAL_DEV_AUTOSETTLE: ${PORTAL_DEV_AUTOSETTLE:-0}
      # Payments. PAYMENT_RAIL selects the rail: btcpay | phoenixd | empty.
      PAYMENT_RAIL: ${PAYMENT_RAIL:-}
      # BTCPay (PAYMENT_RAIL=btcpay). Empty BTCPAY_URL also disables it.
      BTCPAY_URL: ${BTCPAY_URL:-}
      BTCPAY_API_KEY: ${BTCPAY_API_KEY:-}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID:-}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET:-}
      # Reach BTCPay's .onion via the Tor container's SOCKS proxy (see btcpay-compose.yaml).
      BTCPAY_SOCKS5: ${BTCPAY_SOCKS5:-}
      # phoenixd (PAYMENT_RAIL=phoenixd) — direct Lightning. The backend refuses to
      # start without PHOENIXD_WEBHOOK_SECRET when this rail is selected. See docs/phoenixd.md.
      PHOENIXD_URL: ${PHOENIXD_URL:-}
      PHOENIXD_PASSWORD: ${PHOENIXD_PASSWORD:-}
      PHOENIXD_WEBHOOK_SECRET: ${PHOENIXD_WEBHOOK_SECRET:-}
      PHOENIXD_SOCKS5: ${PHOENIXD_SOCKS5:-}
      PHOENIXD_POLL_INTERVAL_S: ${PHOENIXD_POLL_INTERVAL_S:-15}
      PHOENIXD_INVOICE_TTL_S: ${PHOENIXD_INVOICE_TTL_S:-3600}
      # Metrics: if set, /metrics requires this bearer token (see docs/observability.md).
      METRICS_TOKEN: ${METRICS_TOKEN:-}

volumes:
  pgdata:
