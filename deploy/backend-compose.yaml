# fips-exit backend host (separate from the exit nodes): Postgres + control plane.
# Copy backend.env.example to backend.env and fill in secrets.

# Explicit project name so the backend stack is isolated from the exit stack
# (docker-compose.yaml) when both run from this directory.
name: fips-exit-backend

# Bounded log retention. See docs/hardening.md#logging--privacy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${PGUSER:-fips}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-fips_exit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-fips}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: fips-exit/backend:dev
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${PGUSER:-fips}:${PGPASSWORD}@db:5432/${PGDATABASE:-fips_exit}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      LISTEN: ":8080"
      SESSION_SECRET: ${SESSION_SECRET:-}
      CHALLENGE_SECRET: ${CHALLENGE_SECRET:-}
      CAPTIVE_TOKEN_SECRET: ${CAPTIVE_TOKEN_SECRET:-}
      PORTAL_TRUST_FIPS_SOURCE: ${PORTAL_TRUST_FIPS_SOURCE:-0}
      PORTAL_SECURE_COOKIES: ${PORTAL_SECURE_COOKIES:-1}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8080}
      PORTAL_DEV_AUTOSETTLE: ${PORTAL_DEV_AUTOSETTLE:-0}
      # Payments (Phase 4). Empty BTCPAY_URL disables the rail.
      BTCPAY_URL: ${BTCPAY_URL:-}
      BTCPAY_API_KEY: ${BTCPAY_API_KEY:-}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID:-}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET:-}
      # Reach BTCPay's .onion via the Tor container's SOCKS proxy (see btcpay-compose.yaml).
      BTCPAY_SOCKS5: ${BTCPAY_SOCKS5:-}
      # Metrics: if set, /metrics requires this bearer token (see docs/observability.md).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Exit nodes reach this API; front it with TLS in production. Bound to
    # localhost here — adjust for your network.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
