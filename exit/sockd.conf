# Dante config for the fips-exit clearnet service.
#
# Authentication is by SOURCE ADDRESS, done in nftables BEFORE traffic reaches
# this port: only fips addresses in the @authorized set are delivered here, so
# SOCKS itself is credential-free (socksmethod: none). Everyone else is
# redirected to the captive daemon and never reaches Dante.
#
# Placeholders ($FIPS_IF, $EXTERNAL_IF, $CLEARNET_BIND, $CLEARNET_PORT) are
# substituted at container start by exit/entrypoint.sh via envsubst.

# Privacy: log errors only. Every rule below uses `log: error`, so successful
# connections and their DESTINATIONS are never logged — only policy violations
# and failures. Do not change these to `log: connect`/`log: disconnect` in
# production unless you accept destination logging.
logoutput: stderr

# Listen on the LOOPBACK address only. Dante is no longer the client-facing
# clearnet endpoint: the connectivity dispatcher owns the fips address:port that
# the nftables gate protects, and forwards non-onion CONNECTs here over loopback.
# So this socket must be reachable only from the local dispatcher, never over
# fips or the public interface. Egress policy below still applies to every
# forwarded request, so the clearnet path stays fully guarded.
internal: $CLEARNET_BIND port = $CLEARNET_PORT

# Egress to the clear internet over the host's public interface, using both
# its IPv4 and IPv6 (route rotation picks the family matching the destination).
external: $EXTERNAL_IF
external.rotation: route

user.notprivileged: nobody

clientmethod: none
socksmethod: none

client pass {
    from: 0/0 to: 0/0
    log: error
}

# --- Egress policy: internet only, never back into fips or private space -----
# fips / .fips is reached natively over the mesh, never through the proxy.
# Blocking fd00::/8 also guarantees all metered proxy traffic is internet
# traffic and prevents re-entry into fips under the exit's identity.
socks block { from: 0/0 to: 0.0.0.0/8        log: error }  # "this network"
socks block { from: 0/0 to: 127.0.0.0/8      log: error }
socks block { from: 0/0 to: 10.0.0.0/8       log: error }
socks block { from: 0/0 to: 100.64.0.0/10    log: error }  # CGNAT
socks block { from: 0/0 to: 172.16.0.0/12    log: error }
socks block { from: 0/0 to: 192.168.0.0/16   log: error }
socks block { from: 0/0 to: 198.18.0.0/15    log: error }  # benchmarking
socks block { from: 0/0 to: 169.254.0.0/16   log: error }  # link-local + cloud metadata
socks block { from: 0/0 to: ::1/128          log: error }
socks block { from: 0/0 to: fd00::/8         log: error }  # all of fips
socks block { from: 0/0 to: fc00::/8         log: error }  # other half of ULA (fc00::/7)
socks block { from: 0/0 to: fe80::/10        log: error }  # IPv6 link-local
# IPv4-mapped IPv6 (e.g. ::ffff:169.254.169.254) needs no rule: Dante refuses
# mapped addresses ("we do not use IPv4-mapped IPv6 addresses"), so a mapped
# destination is normalized to plain IPv4 and matched by the IPv4 rules above —
# it cannot slip past them. For cloud deployments, add a host-level egress block
# to the metadata IP as defense-in-depth (see docs/hardening.md).

# --- Abuse-prone destination ports -------------------------------------------
# Block outbound mail by default so the exit can't be used as a spam relay — the
# top abuse/blocklisting risk for an open internet exit. Remove or adjust these
# if your users have a legitimate need; add more the same way (e.g. IRC:6667).
# `to: 0/0` matches both address families (as the catch-all pass below does).
socks block { from: 0/0 to: 0/0 port = 25   log: error }   # SMTP
socks block { from: 0/0 to: 0/0 port = 465  log: error }   # SMTPS (submission)
socks block { from: 0/0 to: 0/0 port = 587  log: error }   # submission

# Block the bind and UDP-associate commands; this is a connect-only exit.
socks block {
    from: 0/0 to: 0/0
    command: bind
    log: error
}
socks block {
    from: 0/0 to: 0/0
    command: udpassociate
    log: error
}

# Everything else: allow, resolve DNS server-side.
socks pass {
    from: 0/0 to: 0/0
    command: connect
    log: error
    socksmethod: none
}
