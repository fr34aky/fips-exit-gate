# Dante config for the fips-exit clearnet service.
#
# Authentication is by SOURCE ADDRESS, done in nftables BEFORE traffic reaches
# this port: only fips addresses in the @authorized set are delivered here, so
# SOCKS itself is credential-free (socksmethod: none). Everyone else is
# redirected to the captive daemon and never reaches Dante.
#
# Placeholders ($FIPS_IF, $EXTERNAL_IF, $CLEARNET_PORT) are substituted at
# container start by exit/entrypoint.sh via envsubst.

logoutput: stderr

# Listen only on the fips interface. The gate (nftables) has already decided
# who is allowed to reach this socket.
internal: $FIPS_IF port = $CLEARNET_PORT

# Egress to the clear internet over the host's public interface, using both
# its IPv4 and IPv6 (route rotation picks the family matching the destination).
external: $EXTERNAL_IF
external.rotation: route

user.notprivileged: nobody

clientmethod: none
socksmethod: none

client pass {
    from: 0/0 to: 0/0
    log: error
}

# --- Egress policy: internet only, never back into fips or private space -----
# fips / .fips is reached natively over the mesh, never through the proxy.
# Blocking fd00::/8 also guarantees all metered proxy traffic is internet
# traffic and prevents re-entry into fips under the exit's identity.
socks block { from: 0/0 to: 127.0.0.0/8      log: error }
socks block { from: 0/0 to: 10.0.0.0/8       log: error }
socks block { from: 0/0 to: 172.16.0.0/12    log: error }
socks block { from: 0/0 to: 192.168.0.0/16   log: error }
socks block { from: 0/0 to: 169.254.0.0/16   log: error }  # link-local + cloud metadata
socks block { from: 0/0 to: ::1/128          log: error }
socks block { from: 0/0 to: fd00::/8         log: error }  # all of fips
socks block { from: 0/0 to: fe80::/10        log: error }  # IPv6 link-local

# Block the bind and UDP-associate commands; this is a connect-only exit.
socks block {
    from: 0/0 to: 0/0
    command: bind
    log: error
}
socks block {
    from: 0/0 to: 0/0
    command: udpassociate
    log: error
}

# Everything else: allow, resolve DNS server-side.
socks pass {
    from: 0/0 to: 0/0
    command: connect
    log: error
    socksmethod: none
}
